  /audit-log:
    get:
      description: 'Append-only audit log, read-only (NFR-007) — no write handlers
        exist for this resource at all. Non-Admin callers are hard-restricted server-side
        (not just route-gated) to a fixed slice of Deal history: entity_type=deal,
        ignoring any entity_type/actor_id they pass. Within that slice, allowed actions
        differ by role — Sales Rep sees stage_changed only; Sales Manager additionally
        sees reassigned/bulk_reassigned (the Deal detail page''s "Owner History" card,
        FR-CRM-025/M-8). Admin has full reach across all entity types (settings, project,
        customer_product, deal, etc.) and may filter by entity_type/actor_id. entity_id/date_from/date_to
        apply to every role, so a non-Admin can still request a specific Deal''s history
        or a date-bounded slice.'
      parameters:
      - description: Filter by entity type (Admin only — ignored for Sales Rep/Sales
          Manager, who are hard-restricted to entity_type=deal)
        in: query
        name: entity_type
        type: string
      - description: Filter by acting user ID (Admin only — ignored for Sales Rep/Sales
          Manager)
        in: query
        name: actor_id
        type: string
      - description: Filter by entity ID (e.g. a specific Deal ID) — applies to all
          roles
        in: query
        name: entity_id
        type: string
      - description: ISO date lower bound (YYYY-MM-DD), filters on created_at
        in: query
        name: date_from
        type: string
      - description: ISO date upper bound (YYYY-MM-DD), filters on created_at
        in: query
        name: date_to
        type: string
      - description: Sort field, prefix with - for descending (default -created_at)
        in: query
        name: sort
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to list audit log
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List audit log entries (Admin/Sales Rep/Sales Manager)
      tags:
      - audit-log
  /companies:
    get:
      description: 'Paginated, filterable Company list, each row annotated with last_activity_at
        (from any company-scoped Activity). Filters: status, tag, industry, search
        (name), stale_days, has_won_deal.'
      parameters:
      - description: active or archived
        in: query
        name: status
        type: string
      - description: Filter by Company tag
        in: query
        name: tag
        type: string
      - description: Filter by industry
        in: query
        name: industry
        type: string
      - description: Search by name
        in: query
        name: search
        type: string
      - description: Filter to companies with no activity in N days
        in: query
        name: stale_days
        type: integer
      - description: Filter to companies with (or without) a won Deal
        in: query
        name: has_won_deal
        type: boolean
      - description: Sort field, prefix - for descending (created_at, name, industry)
        in: query
        name: sort
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated company list (data, page, per_page, total)
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List companies
      tags:
      - companies
    post:
      consumes:
      - application/json
      description: Creates a Company. name is required; size/revenue_size must each
        match an active configured option (see /admin/company-sizes, /admin/revenue-sizes).
        industry is free text — any non-empty value is auto-registered as an active
        /admin/industries option if it isn't one already. domain is derived server-side
        from website.
      parameters:
      - description: Company fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.companyForm'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
