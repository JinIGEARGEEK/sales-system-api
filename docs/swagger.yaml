      description: Updates a Prospect, including status transitions. status "Converted"
        cannot be set directly (only via POST /prospects/:id/convert), except re-submitting
        an already-Converted record's unchanged status. source must be an active Prospect
        source and status an active Prospect stage. A Sales Rep may only act on/assign
        to their own prospects.
      parameters:
      - description: Prospect ID
        in: path
        name: id
        required: true
