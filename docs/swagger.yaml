  /prospects/{id}/convert:
    post:
      consumes:
      - application/json
      description: 'Converts a Prospect into a Lead (and a Company/Contact if not
        supplied or not already linked) in one transaction: resolve-or-create Company,
        resolve-or-create Contact, create the Lead with a back-reference to the source
        Prospect, carry over Attachments, then mark the Prospect "Converted" and stamp
        its converted_lead_id. Fails with 409 if already converted. Source/tags are
        carried over as-is even if they aren''t among the Lead''s own configured options.'
      parameters:
      - description: Prospect ID
        in: path
        name: id
        required: true
        type: integer
      - description: Optional company_id/contact_id to link, and lead.assigned_to
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.prospectConvertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: lead, company, contact
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Not authorized to convert this prospect
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Prospect not found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Prospect has already been converted
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Convert a prospect into a lead (Admin/Marketing/Sales Manager/Sales
        Rep)
      tags:
      - prospects
