  /prospects:
    get:
      description: 'Returns a paginated list of Prospects. Filters: status, source,
        assigned_to ("unassigned" for unassigned), company_id (exact match), search
        (name/email/company name), exclude_converted ("true" to hide already-converted
        Prospects). Mirrors LeadHandler.List.'
      parameters:
      - description: Filter by status
        in: query
