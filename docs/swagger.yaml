        "400":
          description: Validation error (invalid source/status/business_unit/email)
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Not authorized to update this prospect
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Prospect not found
          schema:
            additionalProperties: true
