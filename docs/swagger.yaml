info:
  contact: {}
  description: |-
    CRM/sales-pipeline API. This spec currently covers the
    Prospect stage, Pipeline stage, and Dashboard summary routes
    as a scaffold — the annotation pattern on those handlers
    (see internal/handlers/prospect_stages.go, pipeline_stages.go,
    dashboard.go) extends to the rest of internal/routes/routes.go
    as they're annotated. Run `go run github.com/swaggo/swag/cmd/swag@v1.16.6
    init -g cmd/api/main.go -o docs --parseDependency --parseInternal` from the
    repo root to regenerate docs/ after editing annotations (the two flags are
    required to resolve gorm.DeletedAt across package boundaries).
  title: Sales System API
  version: "1.0"
paths:
  /admin/company-sizes:
    get:
      description: Returns every configured Company size bucket (active + inactive),
        ordered by name.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_igeargeek_sales-system-api_internal_models.CompanySizeOption'
            type: array
      security:
      - BearerAuth: []
      summary: List company sizes
      tags:
      - admin/company-sizes
    post:
      consumes:
      - application/json
      description: Admin-only.
      parameters:
      - description: Company size fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.companySizeOptionForm'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_igeargeek_sales-system-api_internal_models.CompanySizeOption'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a company size
      tags:
      - admin/company-sizes
  /admin/company-sizes/{id}:
    delete:
      description: 'Admin-only. Soft-delete (is_active: false).'
      parameters:
      - description: Company size ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Deactivate a company size
      tags:
      - admin/company-sizes
    patch:
      consumes:
      - application/json
      description: Admin-only.
      parameters:
      - description: Company size ID
        in: path
        name: id
        required: true
        type: integer
      - description: Company size fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.companySizeOptionForm'
      produces:
      - application/json
      responses:
        "200":
          description: OK
