  /tags:
    get:
      description: 'Any authenticated role — open so tag pickers on Companies/Deals/Contacts
        can populate. Returns a paginated list of tags. Filters: category, status,
        search (matches name).'
      parameters:
      - description: Filter by category
        in: query
        name: category
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Search name
        in: query
        name: search
        type: string
      - description: Sort field, prefix with - for descending (default -created_at)
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated tag list (data, page, per_page, total)
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List tags (any authenticated role)
      tags:
      - tags
    post:
      consumes:
      - application/json
      description: Admin/SalesManager only. Shared taxonomy across Companies/Deals/Contacts.
        Defaults status to active when omitted.
      parameters:
      - description: Tag fields (name, category, description, status)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.tagForm'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_igeargeek_sales-system-api_internal_models.Tag'
        "400":
          description: Invalid body
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a tag (Admin/SalesManager only)
      tags:
      - tags
  /tags/{id}:
    delete:
      description: Admin/SalesManager only. Soft-delete (sets status to inactive),
        not a hard delete.
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Tag not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a tag (Admin/SalesManager only)
      tags:
      - tags
    put:
      consumes:
      - application/json
      description: Admin/SalesManager only. Full update; status is only overwritten
        if provided.
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: integer
      - description: Tag fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.tagForm'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_igeargeek_sales-system-api_internal_models.Tag'
        "400":
          description: Invalid body
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Tag not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update a tag (Admin/SalesManager only)
      tags:
      - tags
  /team-members:
    get:
      description: Any authenticated role — not Admin-restricted, §2.2. Lightweight
        active-user list (id, name, email) for assignee dropdowns.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handlers.teamMember'
            type: array
      security:
      - BearerAuth: []
      summary: List team members (any authenticated role)
      tags:
      - users
  /users:
    get:
      description: 'Returns a paginated list of users. Admin only. Filters: role,
        status (active/inactive), search (matches first_name/last_name/email). Sortable
        by created_at, first_name, email.'
      parameters:
      - description: Filter by role
        in: query
        name: role
        type: string
      - description: Filter by status (active/inactive)
        in: query
        name: status
        type: string
      - description: Search first_name/last_name/email
        in: query
        name: search
        type: string
      - description: Sort field, prefix with - for descending (default -created_at)
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated user list (data, page, per_page, total)
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List users (Admin only)
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Admin only. Creates a user account; email must be on the allowed
        company domain. If password is omitted, a temporary password is generated
        and must_change_password is forced true. The response never includes password_hash
        (excluded via json:"-").
      parameters:
      - description: User fields (first_name, last_name, email, tel, password, role,
          status, notes)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.userForm'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_igeargeek_sales-system-api_internal_models.User'
        "400":
          description: Invalid body or missing required fields
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a user (Admin only)
      tags:
      - users
  /users/{id}:
    delete:
      description: Admin only. Soft-delete (deactivates and gorm soft-deletes the
        row), not a hard delete §1.6. Also invalidates the user's cached auth state.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a user (Admin only)
      tags:
      - users
    get:
      description: Admin only. Returns a single user by ID. The response never includes
        password_hash (excluded via json:"-").
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_igeargeek_sales-system-api_internal_models.User'
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get a user (Admin only)
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Admin only. Full update; email must be on the allowed company domain.
        Password is only changed if provided (forces must_change_password true). The
        response never includes password_hash (excluded via json:"-").
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: User fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.userForm'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_igeargeek_sales-system-api_internal_models.User'
        "400":
          description: Invalid body or missing required fields
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update a user (Admin only)
      tags:
      - users
  /users/{id}/restore:
    post:
      description: Admin only. Restores a soft-deleted user. Leaves is_active false
        — an Admin re-activates separately via Update.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_igeargeek_sales-system-api_internal_models.User'
        "404":
          description: Deleted user not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Restore a deleted user (Admin only)
      tags:
      - users
  /users/trash:
    get:
      description: Admin only. Returns soft-deleted users.
      produces:
      - application/json
      responses:
        "200":
          description: Paginated user list (data, page, per_page, total)
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List deleted users (Admin only)
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Bearer JWT, e.g. "Bearer <token>".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
