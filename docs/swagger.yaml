      - description: Filter by source
        in: query
        name: source
        type: string
      - description: Filter by assigned user ID, or \
        in: query
        name: assigned_to
        type: string
      - description: Filter by Company ID
        in: query
        name: company_id
        type: integer
      - description: Search by name/email/company name
        in: query
        name: search
        type: string
      - description: Set to \
        in: query
        name: exclude_converted
        type: string
      - description: Sort field, prefix with - for descending (created_at, name)
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated prospect list (data, page, per_page, total)
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List prospects (Admin/Marketing/Sales Manager/Sales Rep)
      tags:
      - prospects
    post:
      consumes:
      - application/json
      description: Creates a new Prospect. status defaults to "New" if omitted; status
        "Converted" cannot be set directly (only via POST /prospects/:id/convert).
        source must be an active Prospect source and status an active Prospect stage.
        A Sales Rep may only assign to themselves.
      parameters:
      - description: Prospect fields
        in: body
        name: body
        required: true
