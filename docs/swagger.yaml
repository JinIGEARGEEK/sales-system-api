  github_com_igeargeek_sales-system-api_internal_models.AppSettings:
    properties:
      annual_revenue_goal:
        type: integer
      id:
        type: integer
      lead_scoring_mql_threshold:
        description: |-
          LeadScoringMqlThreshold — FR-CRM-007: a Lead whose computed Score meets
          or exceeds this value is classified "mql". Lives here rather than a new
          singleton table since it's one more Admin-tunable number, same shape as
          the two fields above.
        type: integer
      quarterly_sales_target:
        type: integer
      require_signed_contract_before_won:
        description: |-
          RequireSignedContractBeforeWon — FR-CRM-045: "configurable, not
          hard-enforced by default," so it defaults false. When true,
          DealHandler blocks a Deal from moving into Won (via Create, Update, or
          UpdateStage) unless it already has at least one Contract with
          status Signed.
        type: boolean
      smtp_configured:
        description: |-
          SMTPConfigured — read-only, derived from config.Config.SMTPHost at
          request time (SettingsHandler.Get/Update set it), never persisted
          (gorm:"-"). Task due-date email reminders (internal/notifier,
          internal/utils/mailer.go) silently no-op with only a server-side log
          line when SMTP_HOST is unset — this is the only place an Admin can see
          that from the app itself, closing a "why aren't reminder emails
          arriving" gap with zero visibility before this.
        type: boolean
      updated_at:
        type: string
    type: object
